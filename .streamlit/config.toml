[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Custom theme: warm off-white / near-black surfaces, one blue accent, rounded corners.
# chartCategoricalColors follow the model order used on every page (LR, decision tree, random forest, XGBoost,
# LightGBM), with the validated light / dark steps of the project palette.
[theme]
font = "sans-serif"
baseRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#256abf"
chartCategoricalColors = ["#2a78d6", "#e87ba4", "#eda100", "#1baf7a", "#eb6834", "#008300", "#4a3aa7", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#f2f1ec"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#ffffff"
borderColor = "#3a3a37"
linkColor = "#6da7ec"
chartCategoricalColors = ["#3987e5", "#d55181", "#c98500", "#199e70", "#d95926", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#21211f"
